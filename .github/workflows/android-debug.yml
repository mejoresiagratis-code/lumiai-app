name: Android Debug Build

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', '**/*.md', 'LICENSE' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ 'docs/**', '**/*.md', 'LICENSE' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Una sola invocación: configuración única del proyecto y grafo de tareas
      # compartido entre tests y APK (antes eran dos invocaciones = doble configure).
      # El daemon queda activo dentro del step (gradle/actions lo gestiona).
      # NOTA: assembleDebug no depende de testDebugUnitTest, así que el APK se genera
      # igual aunque fallen tests; pero si este step falla, GitHub Actions salta los
      # siguientes por defecto. continue-on-error deja avanzar al step de subida SIN
      # ocultar el fallo: el job entero sigue en rojo por el paso "Comprobar resultado".
      # Tests de dominio (rápidos, milisegundos) + APK. Los tests Robolectric de
      # semántica Compose van marcados @Category(SlowTest) y se excluyen aquí con
      # -PexcludeSlowTests: descargan el JAR de Android y arrancan un entorno emulado,
      # eran ~2-2.5 min del job. En local corren sin la flag. Ver app/build.gradle.kts.
      - name: Unit tests + debug APK
        id: build
        continue-on-error: true
        run: ./gradlew testDebugUnitTest assembleDebug -PexcludeSlowTests

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 3

      # Refleja el resultado real del build/tests SIN haber bloqueado la subida de arriba.
      - name: Comprobar resultado
        if: steps.build.outcome == 'failure'
        run: exit 1

  # Solo bajo demanda (workflow_dispatch): antes corría en cada push en paralelo,
  # duplicando setup de JDK+Gradle y ocupando runner sin bloquear nada.
  quality:
    name: Quality (no bloqueante, manual)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Download ktlint 1.7.0
        continue-on-error: true
        run: |
          curl -sSLo ktlint https://github.com/pinterest/ktlint/releases/download/1.7.0/ktlint
          chmod +x ktlint

      - name: ktlint
        continue-on-error: true
        run: ./ktlint "app/src/**/*.kt" --reporter=plain --relative || true

      - name: Android Lint (gate — abortOnError)
        run: ./gradlew :app:lintDebug

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.*
          if-no-files-found: warn
          retention-days: 3

  release:
    # Solo en main: la build minificada tarda mas y los PRs ya validan con debug.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Con secretos configurados firma con la clave real; sin ellos, con la de debug
      # (instalable para smoke, imposible de publicar). El mapping de R8 se sube como
      # artefacto SIEMPRE: es lo que des-ofusca los stacktraces de Crashlytics.
      - name: Release APK (R8) + mapping
        env:
          LUMI_KEYSTORE_BASE64: ${{ secrets.LUMI_KEYSTORE_BASE64 }}
          LUMI_KEYSTORE_PASSWORD: ${{ secrets.LUMI_KEYSTORE_PASSWORD }}
          LUMI_KEY_ALIAS: ${{ secrets.LUMI_KEY_ALIAS }}
          LUMI_KEY_PASSWORD: ${{ secrets.LUMI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 7
