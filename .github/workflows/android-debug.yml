name: Android Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      build_apks:
        description: 'Also build debug and release APKs for direct device testing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, Lint and signed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # One runner shares compiled outputs; main saves release caches as well.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: All unit tests and Android Lint
        run: ./gradlew testDebugUnitTest :app:lintDebug --stacktrace

      - name: Verify release signing
        if: github.ref == 'refs/heads/main'
        env:
          LUMI_KEYSTORE_BASE64: ${{ secrets.LUMI_KEYSTORE_BASE64 }}
          LUMI_KEYSTORE_PASSWORD: ${{ secrets.LUMI_KEYSTORE_PASSWORD }}
          LUMI_KEY_ALIAS: ${{ secrets.LUMI_KEY_ALIAS }}
          LUMI_KEY_PASSWORD: ${{ secrets.LUMI_KEY_PASSWORD }}
        run: |
          for key in LUMI_KEYSTORE_BASE64 LUMI_KEYSTORE_PASSWORD LUMI_KEY_ALIAS LUMI_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing release signing configuration: $key"
              exit 1
            fi
          done

      - name: Signed release AAB and R8 mapping
        if: github.ref == 'refs/heads/main'
        env:
          LUMI_KEYSTORE_BASE64: ${{ secrets.LUMI_KEYSTORE_BASE64 }}
          LUMI_KEYSTORE_PASSWORD: ${{ secrets.LUMI_KEYSTORE_PASSWORD }}
          LUMI_KEY_ALIAS: ${{ secrets.LUMI_KEY_ALIAS }}
          LUMI_KEY_PASSWORD: ${{ secrets.LUMI_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Optional debug APK
        if: github.event_name == 'pull_request' || inputs.build_apks == true
        run: ./gradlew assembleDebug --stacktrace

      - name: Optional release APK
        if: github.ref == 'refs/heads/main' && inputs.build_apks == true
        env:
          LUMI_KEYSTORE_BASE64: ${{ secrets.LUMI_KEYSTORE_BASE64 }}
          LUMI_KEYSTORE_PASSWORD: ${{ secrets.LUMI_KEYSTORE_PASSWORD }}
          LUMI_KEY_ALIAS: ${{ secrets.LUMI_KEY_ALIAS }}
          LUMI_KEY_PASSWORD: ${{ secrets.LUMI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release AAB
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload R8 mapping
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK
        if: success() && (github.event_name == 'pull_request' || inputs.build_apks == true)
        uses: actions/upload-artifact@v4
        with:
          name: lumiai-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload release APK
        if: success() && github.ref == 'refs/heads/main' && inputs.build_apks == true
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.*
          if-no-files-found: warn
          retention-days: 7
