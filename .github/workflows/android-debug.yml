name: Android Debug Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase:
    name: Firebase deletion and rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Deletion and security rules against isolated emulators
        run: functions/node_modules/.bin/firebase emulators:exec --project demo-lumiai-deletion --only auth,firestore "npm test --prefix functions"
      - name: Upload emulator logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-logs-${{ github.run_number }}
          path: '*-debug.log'
          retention-days: 7
  build:
    name: Tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: All unit tests (including Compose semantics)
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload tested debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumiai-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-*.*
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: [build, quality, firebase]
    # Solo en main: la build minificada tarda mas y los PRs ya validan con debug.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Con secretos configurados firma con la clave real; sin ellos, con la de debug
      # (instalable para smoke, imposible de publicar). El mapping de R8 se sube como
      # artefacto SIEMPRE: es lo que des-ofusca los stacktraces de Crashlytics.
      # En main la firma REAL es obligatoria: sin secretos, la build caeria a la clave de
      # debug y el job seguiria en verde, dando la falsa impresion de tener un artefacto
      # publicable. Play rechazaria esa firma al subirla (22-ago).
      - name: Verificar secretos de firma
        env:
          LUMI_KEYSTORE_BASE64: ${{ secrets.LUMI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LUMI_KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secretos de firma (LUMI_*). El artefacto no seria publicable."
            exit 1
          fi

      # AAB **y** APK: Play exige App Bundle para aplicaciones nuevas desde 2021, pero el APK
      # sigue siendo util para instalar en el dispositivo y hacer smoke test (22-ago).
      - name: Release AAB + APK (R8) + mapping
        env:
          LUMI_KEYSTORE_BASE64: ${{ secrets.LUMI_KEYSTORE_BASE64 }}
          LUMI_KEYSTORE_PASSWORD: ${{ secrets.LUMI_KEYSTORE_PASSWORD }}
          LUMI_KEY_ALIAS: ${{ secrets.LUMI_KEY_ALIAS }}
          LUMI_KEY_PASSWORD: ${{ secrets.LUMI_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      # El artefacto QUE SE SUBE A PLAY. Retencion mayor que el APK: es el entregable.
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 7
